  <circle cx="770" cy="485" r="18" fill="#f43b9d"/>
  <text x="824" y="489" fill="#eef5f8" font-family="Arial, sans-serif" font-size="16" font-weight="700">product-front.png</text>
  <text x="824" y="516" fill="#9fb0bb" font-family="Arial, sans-serif" font-size="15">studio-background.png</text>

  <rect x="82" y="570" width="520" height="136" rx="10" fill="#0d1419" stroke="#3b4d58" stroke-width="2"/>
  <text x="104" y="602" fill="#6ed8ef" font-family="Arial, sans-serif" font-size="14" font-weight="700">PROMPT 2</text>
  <text x="104" y="637" fill="#edf4f7" font-family="Arial, sans-serif" font-size="17">Create a vibrant lifestyle scene while</text>
  <text x="104" y="666" fill="#edf4f7" font-family="Arial, sans-serif" font-size="17">preserving the product shape and colors.</text>

  <rect x="626" y="570" width="572" height="136" rx="10" fill="#0d1419" stroke="#3b4d58" stroke-width="2"/>
  <text x="648" y="602" fill="#ff86c4" font-family="Arial, sans-serif" font-size="14" font-weight="700">PER-PROMPT CONTROL</text>
  <rect x="648" y="621" width="134" height="46" rx="8" fill="#2c9fc4"/>
  <text x="715" y="650" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Replace image</text>
  <rect x="798" y="621" width="124" height="46" rx="8" fill="#10181d" stroke="#40535e" stroke-width="2"/>
  <text x="860" y="650" text-anchor="middle" fill="#dce7ec" font-family="Arial, sans-serif" font-size="16" font-weight="700">Use default</text>
  <text x="1172" y="650" text-anchor="end" fill="#9fb0bb" font-family="Arial, sans-serif" font-size="15">Up to 3 images</text>
</svg>

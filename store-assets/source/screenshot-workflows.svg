<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#0b1116"/>
  <text x="54" y="74" fill="#f4f8fa" font-family="Arial, sans-serif" font-size="36" font-weight="700">One queue. Four creative workflows.</text>
  <text x="54" y="108" fill="#9fb0bb" font-family="Arial, sans-serif" font-size="18">Switch between image and video generation without rebuilding your prompt list.</text>

  <rect x="54" y="144" width="278" height="164" rx="12" fill="#142129" stroke="#2ea8ce" stroke-width="2"/>
  <circle cx="92" cy="182" r="18" fill="#2ea8ce"/>
  <path d="m85 172 17 10-17 10Z" fill="#fff"/>
  <text x="122" y="188" fill="#eef5f8" font-family="Arial, sans-serif" font-size="21" font-weight="700">Text to video</text>
  <text x="78" y="230" fill="#a8bac4" font-family="Arial, sans-serif" font-size="15">Turn prompt lines into queued</text>
  <text x="78" y="254" fill="#a8bac4" font-family="Arial, sans-serif" font-size="15">Veo video generations.</text>
  <rect x="78" y="274" width="116" height="7" rx="3.5" fill="#2ea8ce"/>

  <rect x="346" y="144" width="278" height="164" rx="12" fill="#142129" stroke="#52636d" stroke-width="2"/>
  <rect x="370" y="165" width="38" height="38" rx="7" fill="#f43b9d"/>
  <path d="m381 176 17 8-17 8Z" fill="#fff"/>
  <text x="424" y="188" fill="#eef5f8" font-family="Arial, sans-serif" font-size="21" font-weight="700">Image to video</text>
  <text x="370" y="230" fill="#a8bac4" font-family="Arial, sans-serif" font-size="15">Assign a reference image, then</text>
  <text x="370" y="254" fill="#a8bac4" font-family="Arial, sans-serif" font-size="15">animate it with each prompt.</text>
  <rect x="370" y="274" width="116" height="7" rx="3.5" fill="#f43b9d"/>

  <rect x="638" y="144" width="278" height="164" rx="12" fill="#142129" stroke="#52636d" stroke-width="2"/>
  <rect x="662" y="165" width="38" height="38" rx="7" fill="#28c7e7"/>
  <circle cx="674" cy="178" r="5" fill="#fff"/>
  <path d="m667 195 9-9 7 6 6-8 7 11Z" fill="#fff"/>
  <text x="716" y="188" fill="#eef5f8" font-family="Arial, sans-serif" font-size="21" font-weight="700">Text to image</text>
  <text x="662" y="230" fill="#a8bac4" font-family="Arial, sans-serif" font-size="15">Batch Nano Banana image</text>
  <text x="662" y="254" fill="#a8bac4" font-family="Arial, sans-serif" font-size="15">prompts with consistent settings.</text>
  <rect x="662" y="274" width="116" height="7" rx="3.5" fill="#28c7e7"/>

  <rect x="930" y="144" width="296" height="164" rx="12" fill="#142129" stroke="#52636d" stroke-width="2"/>
  <rect x="954" y="165" width="38" height="38" rx="7" fill="#ff6c73"/>
  <rect x="962" y="173" width="22" height="22" rx="4" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="1008" y="188" fill="#eef5f8" font-family="Arial, sans-serif" font-size="21" font-weight="700">Image to image</text>
  <text x="954" y="230" fill="#a8bac4" font-family="Arial, sans-serif" font-size="15">Transform reference images with</text>
  <text x="954" y="254" fill="#a8bac4" font-family="Arial, sans-serif" font-size="15">prompt-specific assignments.</text>
  <rect x="954" y="274" width="116" height="7" rx="3.5" fill="#ff6c73"/>

  <rect x="54" y="340" width="1172" height="404" rx="14" fill="#111a20" stroke="#344650" stroke-width="2"/>
  <text x="82" y="382" fill="#eef5f8" font-family="Arial, sans-serif" font-size="22" font-weight="700">Prompt review</text>
  <text x="1194" y="382" text-anchor="end" fill="#9fb0bb" font-family="Arial, sans-serif" font-size="16">Reference images  2 / 3</text>

  <rect x="82" y="410" width="520" height="136" rx="10" fill="#0d1419" stroke="#3b4d58" stroke-width="2"/>
  <text x="104" y="442" fill="#6ed8ef" font-family="Arial, sans-serif" font-size="14" font-weight="700">PROMPT 1</text>
  <text x="104" y="477" fill="#edf4f7" font-family="Arial, sans-serif" font-size="17">Slow cinematic push toward the product,</text>
  <text x="104" y="506" fill="#edf4f7" font-family="Arial, sans-serif" font-size="17">soft studio light, premium commercial look.</text>

  <rect x="626" y="410" width="572" height="136" rx="10" fill="#0d1419" stroke="#3b4d58" stroke-width="2"/>
  <text x="648" y="442" fill="#ff86c4" font-family="Arial, sans-serif" font-size="14" font-weight="700">ASSIGNED IMAGES</text>
  <rect x="648" y="460" width="72" height="62" rx="8" fill="#214a5a"/>
  <circle cx="684" cy="484" r="12" fill="#f1bd4b"/>
  <path d="m657 515 22-22 14 13 10-16 11 25Z" fill="#59bad6"/>
